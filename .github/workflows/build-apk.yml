name: Build KoreaVibe APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:


jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ========================================
      # 1. Получаем проект
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. Python
      # ========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ========================================
      # 3. Java
      # Java нужна Android-инструментам сборки
      # ========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ========================================
      # 4. Системные зависимости
      # ========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            m4 \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev


      # ========================================
      # 5. Проверяем только необходимые
      # инструменты
      # ========================================
      - name: Check tools
        run: |
          echo "Python:"
          python --version

          echo ""
          echo "Pip:"
          pip --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Java compiler:"
          javac -version

          echo ""
          echo "Git:"
          git --version


      # ========================================
      # 6. Устанавливаем Buildozer
      # ========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install "Cython<3"
          python -m pip install buildozer


      # ========================================
      # 7. Проверяем Buildozer
      # ========================================
      - name: Check Buildozer
        run: |
          buildozer --version


      # ========================================
      # 8. Проверяем файлы проекта
      # ========================================
      - name: Check project
        run: |
          echo "Файлы проекта:"
          ls -lah

          echo ""

          if [ -f buildozer.spec ]; then
            echo "buildozer.spec найден"
          else
            echo "ОШИБКА: buildozer.spec не найден!"
            exit 1
          fi


      # ========================================
      # 9. Очистка
      # ========================================
      - name: Clean
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ========================================
      # 10. Сборка APK
      # ========================================
      - name: Build APK
        run: |
          buildozer -v android debug


      # ========================================
      # 11. Проверяем APK
      # ========================================
      - name: Check APK
        if: always()
        run: |
          echo "================================"
          echo "Содержимое bin:"
          echo "================================"

          ls -lah bin || true

          echo ""
          echo "================================"
          echo "Поиск APK:"
          echo "================================"

          find . -type f -name "*.apk" -print


      # ========================================
      # 12. Загружаем APK
      # ========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KoreaVibe-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
