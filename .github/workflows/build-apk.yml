name: Build KoreaVibe APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # =========================
      # Получение проекта
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # Java
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # Системные зависимости
      # =========================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            m4 \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      # =========================
      # Проверка инструментов
      # =========================
      - name: Check tools
        run: |
          echo "Python:"
          python --version

          echo "Pip:"
          pip --version

          echo "Autoconf:"
          autoconf --version

          echo "Automake:"
          automake --version

          echo "Libtool:"
          libtool --version

          echo "Java:"
          java -version

      # =========================
      # Python packages
      # =========================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install "Cython<3"
          python -m pip install buildozer

      # =========================
      # Проверяем Buildozer
      # =========================
      - name: Check Buildozer
        run: |
          buildozer --version

      # =========================
      # Очистка старой сборки
      # =========================
      - name: Clean
        run: |
          rm -rf .buildozer
          rm -rf bin

      # =========================
      # Сборка APK
      # =========================
      - name: Build APK
        run: |
          buildozer -v android debug

      # =========================
      # Проверяем результат
      # =========================
      - name: Check APK
        if: always()
        run: |
          echo "================================"
          echo "Содержимое папки bin:"
          echo "================================"

          ls -lah bin || true

          echo ""
          echo "================================"
          echo "Поиск APK:"
          echo "================================"

          find . -type f -name "*.apk" -print

          echo ""
          echo "================================"
          echo "Поиск AAB:"
          echo "================================"

          find . -type f -name "*.aab" -print

      # =========================
      # Сохраняем APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KoreaVibe-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
